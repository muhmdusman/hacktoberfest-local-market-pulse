[project]
name = "hacktober-backend"
version = "0.1.0"
description = "FastAPI backend for the Hacktoberfest Islamabad 2026 project"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits a running server with curl (start uvicorn first)",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
